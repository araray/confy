[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confy"
version = "0.4.2"
description = "Minimal Python configuration library with dot-notation, JSON/TOML, env-var and dict overrides."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name="Araray Velho", email="araray@gmail.com" }]
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.1.0",
    "tomli",
    "tomli-w"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
accurate-tokens = [
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "coverage[toml]>=7",
]

[project.scripts]
confy = "confy.cli:cli"

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportAny = false
reportExplicitAny = false
reportImplicitOverride = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
strict_markers = true
strict_config = true
addopts = "-rfE"
markers = [
    "unit: fast pure-function unit tests (no I/O, no env mutation beyond monkeypatch)",
    "integration: multi-component tests exercising Config end-to-end with files and env",
    "cli: tests that exercise the click CLI via CliRunner",
    "robustness: malformed-input, optional-dependency, and edge-case tests",
    "slow: tests slower than ~100ms (none yet; reserved for future use)",
]

[tool.coverage.run]
source = ["confy"]
branch = true
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
